spring:
  application:
    name: payrecon-backend

  datasource:
    url: jdbc:postgresql://localhost:5435/payrecon
    username: payrecon
    password: payrecon
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/procedures.sql
      separator: "//"

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

payrecon:
  batch:
    scheduling:
      enabled: false
      cron: "0 0 2 * * *"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
