spring:
  application:
    name: payrecon-backend

  datasource:
    url: jdbc:postgresql://localhost:5435/payrecon
    username: payrecon
    password: payrecon
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
