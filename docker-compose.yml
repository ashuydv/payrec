services:
  postgres:
    image: postgres:16-alpine
    container_name: payrecon-postgres
    environment:
      POSTGRES_DB: payrecon
      POSTGRES_USER: payrecon
      POSTGRES_PASSWORD: payrecon
    ports:
      - "5435:5432"
    volumes:
      - payrecon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrecon -d payrecon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payrecon-postgres-data:
