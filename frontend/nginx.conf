server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend so the browser never needs CORS in
    # production — only local `ng serve` (a different origin) needs the
    # CORS config in the backend's WebConfig.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular client-side routing: fall back to index.html for any path
    # that isn't a real static file, so deep links (e.g. /reconciliation)
    # work on a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
